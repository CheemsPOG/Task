services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: chart
      POSTGRES_USER: chart
      POSTGRES_PASSWORD: chart
    volumes:
      - chart-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chart -d chart"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Doc 121 Peach cache namespaces (cache_set_*) — Redis ZSETs, not in-JVM maps.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  chart-pgdata:
