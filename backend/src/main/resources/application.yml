spring:
  application:
    name: chart-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:chart}
    username: ${DB_USER:chart}
    password: ${DB_PASSWORD:chart}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    use-root-path: true

app:
  cors-origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
    - http://localhost:3000
    - http://127.0.0.1:3000
  jwt:
    # Local demo only — replace for any shared environment.
    secret: "chart-local-demo-jwt-secret-key-at-least-256-bits-long"
    access-expiration-ms: 3600000
    refresh-expiration-ms: 86400000
  chart-cache:
    # Writer thread refresh interval (doc 121 concurrent cache writer stand-in).
    refresh-ms: 60000
  tradingview:
    supports-search: true
    # Enabled for design docs 125 / 126 (marks + timescale marks).
    supports-marks: true
    supports-timescale-marks: true
    supports-time: true
    exchanges: CTFX
    symbols-types: FOREX
    timezone: Asia/Tokyo
    has-intraday: true
    visible-plots-set: ohlc
    has-seconds: true
    time-summer: "0700-3000:2|0600-3000:345|0600-2940:6"
    time-winter: "0700-3100:2|0700-3100:345|0700-3040:6"
    search-default-limit: 100
    search-max-limit: 100
    supported-resolutions:
      - 1S
      - 1
      - 5
      - 15
      - 30
      - 60
      - 120
      - 240
      - 480
      - 1D
      - 1W
      - 1M
    intraday-multipliers:
      - "1"
      - "5"
      - "15"
      - "30"
      - "60"
      - "120"
      - "240"
      - "480"
